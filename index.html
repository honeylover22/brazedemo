<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safia – Gourmet Bakery</title>

  <!-- Google Fonts: Playfair Display (headings) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- FontAwesome Kit (a21f98a3f6) -->
  <script src="https://kit.fontawesome.com/a21f98a3f6.js" crossorigin="anonymous" defer></script>

  <!-- Braze WebSDK — app degrades gracefully if blocked by extensions -->
  <script src="https://js.appboycdn.com/web-sdk/5.3/braze.min.js"
          onerror="console.warn('[SDK] Braze CDN blocked — running in demo mode')"></script>

  <style>
    /* ============================================================
       DESIGN TOKENS — sourced from design.json
    ============================================================ */
    :root {
      /* Brand Colors */
      --color-primary:       #D4B982;
      --color-primary-light: #F9F3E7;
      --color-bg:            #FFFCF7;
      --color-text:          #1A1A1A;
      --color-muted:         #757575;
      --color-gold:          #C5A358;
      --color-white:         #FFFFFF;

      /* Phone Frame */
      --phone-w:    390px;
      --phone-h:    844px;
      --safe-top:   47px;
      --safe-bottom:34px;
      --iphone-r:   40px;

      /* Spacing */
      --sm:  var(--safe-top);
      --sb:  var(--safe-bottom);
      --mx:  16px;
      --gap: 12px;

      /* Border Radii */
      --r-card:   24px;
      --r-btn:    16px;
      --r-input:  12px;
      --r-pill:   50px;
    }

    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(150deg, #f0e8d8 0%, #e5dbd0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0 48px;
      color: var(--color-text);
      user-select: none;
    }

    /* ============================================================
       PHONE FRAME
    ============================================================ */
    #phone-frame {
      width:  var(--phone-w);
      height: var(--phone-h);
      border: 12px solid #1C1C1E;
      border-radius: var(--iphone-r);
      position: relative;
      overflow: hidden;
      background: var(--color-bg);
      box-shadow:
        0 40px 100px rgba(0,0,0,0.35),
        0 0 0 1px rgba(255,255,255,0.08) inset;
      flex-shrink: 0;
    }

    /* Dynamic Island */
    #phone-frame::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #1C1C1E;
      border-radius: 20px;
      z-index: 200;
    }

    /* App scrollable content area — sits above bottom nav */
    #app-content {
      position: absolute;
      inset: 0 0 calc(56px + var(--safe-bottom)) 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      background: var(--color-bg);
    }
    #app-content::-webkit-scrollbar { display: none; }

    /* ============================================================
       SCREENS
    ============================================================ */
    .screen { display: none; min-height: 100%; }
    .screen.active { display: block; }

    /* ============================================================
       BOTTOM NAVIGATION
    ============================================================ */
    .bottom-nav {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: calc(56px + var(--safe-bottom));
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(0,0,0,0.07);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 8px;
      padding-bottom: var(--safe-bottom);
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      color: #8E8E93;
      transition: all .15s ease;
      min-height: 44px;
      min-width: 44px;
      justify-content: center;
      padding-top: 2px;
    }
    .nav-item:active { transform: scale(.88); opacity: .7; }
    .nav-item.active { color: var(--color-gold); }
    .nav-item > i { font-size: 1.4rem; }
    .nav-item span { font-size: 10px; font-weight: 500; }

    /* Center cart button — raised */
    .nav-cart-wrap {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-primary), var(--color-gold));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(197,163,88,.45);
      margin-top: -20px;
      position: relative;
    }
    .nav-cart-wrap i { font-size: 1.25rem; color: #fff; }
    .nav-item.active .nav-cart-wrap { box-shadow: 0 4px 22px rgba(197,163,88,.65); }
    .cart-badge {
      position: absolute; top: -4px; right: -4px;
      background: #FF3B30; color: #fff;
      font-size: 9px; font-weight: 700;
      min-width: 16px; height: 16px;
      border-radius: 50%; padding: 0 3px;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid #fff;
    }

    /* ============================================================
       SCREEN HEADER (sticky glassmorphism)
    ============================================================ */
    .screen-header {
      padding: 8px var(--mx) 12px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,252,247,.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 50;
    }

    /* ============================================================
       BUTTONS
    ============================================================ */
    .btn-ghost-icon {
      width: 38px; height: 38px; border-radius: 50%;
      border: none; background: rgba(0,0,0,.06);
      cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center;
      color: var(--color-muted); transition: background .2s;
    }
    .btn-ghost-icon:active { background: rgba(0,0,0,.12); }
    .btn-ghost-icon i { font-size: 14px; }

    .btn-pill {
      background: var(--color-primary-light);
      color: var(--color-gold);
      border: none; border-radius: var(--r-pill);
      padding: 14px 24px; font-size: 15px; font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer; width: 100%;
      transition: all .15s ease;
    }
    .btn-pill:active { transform: scale(.97); background: var(--color-primary); color: #fff; }

    .btn-pill-solid {
      background: linear-gradient(135deg, var(--color-primary), var(--color-gold));
      color: #fff; border: none; border-radius: var(--r-pill);
      padding: 14px 24px; font-size: 15px; font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer; width: 100%;
      box-shadow: 0 4px 16px rgba(197,163,88,.3);
      transition: all .15s ease;
    }
    .btn-pill-solid:active { transform: scale(.97); box-shadow: 0 2px 8px rgba(197,163,88,.3); }

    /* ============================================================
       SECTION HEADER
    ============================================================ */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px var(--mx) 10px;
    }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px; font-weight: 600; color: var(--color-text);
    }
    .see-all {
      font-size: 13px; font-weight: 500;
      color: var(--color-gold); cursor: pointer;
    }

    /* ============================================================
       CAROUSEL
    ============================================================ */
    .carousel-outer { padding: 0 var(--mx) 4px; }
    .carousel-clip {
      border-radius: var(--r-card);
      overflow: hidden; position: relative;
    }
    .carousel-track {
      display: flex;
      transition: transform .42s cubic-bezier(.25,.46,.45,.94);
    }
    .carousel-slide {
      min-width: 100%; height: 180px;
      display: flex; align-items: center;
      padding: 24px; border-radius: var(--r-card);
      overflow: hidden;
    }
    .carousel-dots {
      display: flex; justify-content: center;
      gap: 6px; margin-top: 10px;
    }
    .carousel-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(197,163,88,.3);
      cursor: pointer; transition: all .3s ease;
    }
    .carousel-dot.active {
      width: 18px; border-radius: 3px;
      background: var(--color-gold);
    }

    /* ============================================================
       ORDER TYPE CARDS (asymmetric grid)
    ============================================================ */
    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
      padding: 0 var(--mx);
    }
    .order-card {
      border-radius: var(--r-card);
      padding: 18px 16px;
      position: relative; overflow: hidden;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }
    .order-card:active { transform: scale(.95); }
    .order-card.selected { box-shadow: 0 0 0 2.5px var(--color-gold), 0 4px 16px rgba(197,163,88,.25); }
    .order-card.square { grid-row: span 2; min-height: 200px; }
    .order-card.horizontal { min-height: 90px; }
    .order-card-arrow {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    /* ============================================================
       CATEGORY PILLS
    ============================================================ */
    .pills-scroll {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 4px var(--mx) 8px;
      scrollbar-width: none;
    }
    .pills-scroll::-webkit-scrollbar { display: none; }
    .pill {
      padding: 7px 16px; border-radius: var(--r-pill);
      font-size: 13px; font-weight: 500; white-space: nowrap;
      cursor: pointer; transition: all .2s ease;
      border: 1.5px solid rgba(0,0,0,.08);
      background: #fff; color: var(--color-muted);
    }
    .pill.active {
      background: var(--color-primary-light);
      color: var(--color-gold);
      border-color: var(--color-primary);
    }

    /* ============================================================
       PRODUCT CARDS
    ============================================================ */
    .product-shelf {
      display: flex; gap: var(--gap); overflow-x: auto;
      padding: 4px var(--mx) 8px;
      scrollbar-width: none;
    }
    .product-shelf::-webkit-scrollbar { display: none; }

    .product-card {
      min-width: 150px; max-width: 150px;
      border-radius: var(--r-card); background: #fff; overflow: hidden;
      cursor: pointer; flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      transition: transform .15s ease;
    }
    .product-card:active { transform: scale(.96); }
    .product-img {
      height: 120px; position: relative;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.4rem;
    }
    .product-info { padding: 10px 12px 12px; }
    .product-name { font-size: 13px; font-weight: 600; color: var(--color-text); line-height: 1.3; }
    .product-price { font-size: 15px; font-weight: 700; color: var(--color-gold); }
    .product-add {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--color-primary-light); border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--color-gold); min-height: 44px; min-width: 44px;
      transition: all .15s ease;
    }
    .product-add:active { transform: scale(.88); background: var(--color-primary); color: #fff; }

    /* Grid variant (2-col catalog) */
    .product-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--gap); padding: 0 var(--mx);
    }
    .product-card-grid {
      background: #fff; border-radius: 20px; overflow: hidden;
      cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.06);
      transition: transform .15s ease;
    }
    .product-card-grid:active { transform: scale(.96); }

    /* Star rating */
    .stars { display: flex; align-items: center; gap: 2px; color: var(--color-gold); font-size: 11px; }

    /* Popular badge */
    .badge-popular {
      position: absolute; top: 8px; right: 8px;
      background: var(--color-gold); color: #fff;
      font-size: 9px; font-weight: 700;
      padding: 2px 8px; border-radius: var(--r-pill);
    }

    /* ============================================================
       SEARCH BAR
    ============================================================ */
    .search-bar {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border-radius: var(--r-input);
      padding: 10px 14px; margin: 8px var(--mx);
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .search-bar input {
      flex: 1; border: none; outline: none;
      font-size: 14px; font-family: 'Inter', sans-serif;
      color: var(--color-text); background: transparent;
    }
    .search-bar input::placeholder { color: var(--color-muted); }
    .filter-btn {
      width: 32px; height: 32px; border-radius: 10px;
      background: var(--color-primary-light);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    /* ============================================================
       PRODUCT DETAIL MODAL (slides up within phone frame)
    ============================================================ */
    #product-detail {
      position: absolute; inset: 0;
      background: var(--color-bg);
      transform: translateY(100%);
      transition: transform .36s cubic-bezier(.25,.46,.45,.94);
      z-index: 150;
      overflow-y: auto; overflow-x: hidden;
    }
    #product-detail::-webkit-scrollbar { display: none; }
    #product-detail.open { transform: translateY(0); }

    .detail-hero {
      height: 260px; display: flex; align-items: center;
      justify-content: center; font-size: 7rem; position: relative;
    }
    .detail-back {
      position: absolute;
      top: calc(var(--safe-top) + 6px); left: 16px;
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(8px);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      z-index: 10;
    }
    .sticky-cta {
      position: sticky;
      bottom: calc(var(--safe-bottom) + 16px);
      padding: 0 var(--mx);
    }

    /* ============================================================
       LOYALTY CARD
    ============================================================ */
    .loyalty-card {
      margin: 0 var(--mx);
      border-radius: var(--r-card);
      background: linear-gradient(135deg, #C5A358 0%, #D4B982 55%, #E8D5A0 100%);
      padding: 20px; position: relative; overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(197,163,88,.35);
    }

    /* ============================================================
       PROMO LIST
    ============================================================ */
    .promo-card {
      background: #fff; border-radius: var(--r-card);
      overflow: hidden; margin: 0 var(--mx) var(--gap);
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .promo-banner-img {
      height: 130px; display: flex; align-items: center;
      justify-content: center; gap: 12px; font-size: 3.4rem;
    }

    /* ============================================================
       TAB SWITCHER
    ============================================================ */
    .tab-switcher {
      display: flex; background: rgba(0,0,0,.05);
      border-radius: var(--r-input); padding: 3px;
      margin: 8px var(--mx);
    }
    .tab-opt {
      flex: 1; text-align: center; padding: 7px 6px;
      border-radius: 10px; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all .2s ease;
      color: var(--color-muted);
    }
    .tab-opt.active {
      background: #fff; color: var(--color-text);
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }

    /* ============================================================
       CART
    ============================================================ */
    .cart-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px var(--mx);
      border-bottom: 1px solid rgba(0,0,0,.05);
    }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--color-primary-light); border: none;
      color: var(--color-gold); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      /* Extend touch area without changing visual size */
      min-height: 44px; min-width: 44px;
      transition: transform .15s ease;
    }
    .qty-btn:active { transform: scale(.88); background: var(--color-primary); color: #fff; }

    /* ============================================================
       PROFILE
    ============================================================ */
    .profile-avatar {
      width: 76px; height: 76px; border-radius: 50%;
      background: linear-gradient(135deg, var(--color-primary), var(--color-gold));
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700;
      font-family: 'Playfair Display', serif; color: #fff;
      margin: 0 auto 12px;
    }
    .menu-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px var(--mx);
      border-bottom: 1px solid rgba(0,0,0,.05);
      cursor: pointer; transition: background .15s;
    }
    .menu-row:active { background: var(--color-primary-light); }
    .menu-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--color-primary-light);
      display: flex; align-items: center; justify-content: center;
      color: var(--color-gold);
    }

    /* ============================================================
       TOAST
    ============================================================ */
    #toast {
      position: absolute; top: 60px; left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: rgba(28,28,30,.92); color: #fff;
      padding: 10px 20px; border-radius: 20px;
      font-size: 13px; font-weight: 500;
      white-space: nowrap; z-index: 300;
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ============================================================
       CONTROLS ABOVE FRAME (outside phone)
    ============================================================ */
    .app-controls {
      display: flex; gap: 8px; margin-bottom: 14px;
      flex-wrap: wrap; justify-content: center;
    }
    .ctrl-btn {
      padding: 7px 18px; border-radius: 20px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      border: none; font-family: 'Inter', sans-serif;
      transition: transform .15s ease, opacity .15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .ctrl-btn:active { transform: scale(.94); opacity: .85; }

    /* ============================================================
       DEBUG OVERLAY (outside phone frame)
    ============================================================ */
    #debug-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.82); z-index: 9999;
      align-items: center; justify-content: center; padding: 20px;
    }
    #debug-overlay.open { display: flex; }
    .debug-panel {
      background: #1A1A1A; border-radius: 16px;
      width: 100%; max-width: 500px; max-height: 82vh;
      overflow-y: auto; padding: 20px;
      color: #E0E0E0; font-family: 'Courier New', monospace; font-size: 12px;
    }
    .debug-panel::-webkit-scrollbar { width: 4px; }
    .debug-panel::-webkit-scrollbar-track { background: #2C2C2C; }
    .debug-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }
    .log-row { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.04); word-break: break-all; }
    .l-INFO  { color: #4CAF50; }
    .l-DEBUG { color: #9E9E9E; }
    .l-WARN  { color: #FFA726; }
    .l-ERROR { color: #EF5350; }

    /* ============================================================
       SCREEN TRANSITIONS
    ============================================================ */
    @keyframes screenFadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .screen.active { animation: screenFadeIn .22s ease both; }

    /* ============================================================
       STATUS BAR (iOS-style — sits behind Dynamic Island)
    ============================================================ */
    #status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--safe-top);
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 22px 9px;
      z-index: 155;
      pointer-events: none;
      background: rgba(255,252,247,.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #status-time {
      font-size: 15px; font-weight: 600; color: var(--color-text);
      font-family: 'Inter', sans-serif; letter-spacing: -.3px;
    }
    .status-icons { display: flex; align-items: center; gap: 5px; }
    .signal-bars { display: flex; align-items: flex-end; gap: 1.5px; }
    .signal-bars span {
      background: var(--color-text); border-radius: 1px;
      width: 3px; display: block;
    }
    .signal-bars span:nth-child(1) { height: 5px; }
    .signal-bars span:nth-child(2) { height: 8px; }
    .signal-bars span:nth-child(3) { height: 11px; }
    .signal-bars span:nth-child(4) { height: 14px; }
    .battery-icon {
      display: flex; align-items: center; gap: 0;
      font-size: 11px; color: var(--color-text);
    }
    .battery-body {
      width: 22px; height: 11px; border: 1.5px solid var(--color-text);
      border-radius: 2.5px; position: relative;
      display: flex; align-items: center; padding: 1.5px;
    }
    .battery-body::after {
      content: ''; position: absolute; right: -4px; top: 50%;
      transform: translateY(-50%);
      width: 2px; height: 5px;
      background: var(--color-text); border-radius: 0 1px 1px 0;
    }
    .battery-fill {
      height: 100%; border-radius: 1px;
      background: var(--color-text); width: 75%;
    }

    /* ============================================================
       SPLASH SCREEN
    ============================================================ */
    #splash-screen {
      position: absolute; inset: 0; z-index: 180;
      background: linear-gradient(160deg, #FDF6E8 0%, #EDD9A3 50%, #C5A358 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px;
      transition: opacity .5s ease;
    }
    #splash-screen.hiding { opacity: 0; pointer-events: none; }
    .splash-logo {
      font-size: 5.5rem; margin-bottom: 8px;
      animation: splashFloat 1.8s ease-in-out infinite alternate;
      filter: drop-shadow(0 8px 20px rgba(197,163,88,.4));
    }
    .splash-app-name {
      font-family: 'Playfair Display', serif;
      font-size: 36px; font-weight: 700; color: #6B4A0A;
      letter-spacing: -.5px;
    }
    .splash-tagline {
      font-size: 12px; font-weight: 600; color: #A07830;

  /* ==============================================================
     STORAGE MANAGER
     Centralises all LocalStorage I/O behind a stable interface.
     Prefix: 'ar_app_' prevents collisions with Braze / Flowbite.
  ============================================================== */

  /**
   * Singleton gateway for all LocalStorage read/write operations.
   * Never call localStorage directly from UI components.
   */
  const StorageManager = {
    PREFIX: 'ar_app_',

    /**
     * Serializes a value and writes it to LocalStorage.
     * @param {string} key   - Key (prefix applied automatically).
     * @param {*}      value - Any JSON-serializable value.
     */
    set(key, value) {
      try {
        localStorage.setItem(`${this.PREFIX}${key}`, JSON.stringify(value));
      } catch (e) {
        AppLogger.error('STORAGE', `Write failed: ${key}`, e);
      }
    },

    /**
     * Reads and deserializes a value. Returns defaultValue on missing/corrupt.
     * @param {string} key          - Key (prefix applied automatically).
     * @param {*}      defaultValue - Fallback value.
     * @returns {*} Parsed value or defaultValue.
     */
    get(key, defaultValue = null) {
      try {
        const raw = localStorage.getItem(`${this.PREFIX}${key}`);
        return raw !== null ? JSON.parse(raw) : defaultValue;
      } catch (e) {
        AppLogger.warn('STORAGE', `Read failed: ${key}`, e);
        return defaultValue;
      }
    },

    /**
     * Removes a single app-prefixed key.
     * @param {string} key - Key (prefix applied automatically).
     */
    remove(key) {
      localStorage.removeItem(`${this.PREFIX}${key}`);
    },

    /**
     * Purges all 'ar_app_' keys, leaving third-party SDK data intact.
     * We wrap Braze's own storage under a different prefix, so this is safe.
     */
    clearSession() {
      Object.keys(localStorage)
        .filter(k => k.startsWith(this.PREFIX))
        .forEach(k => localStorage.removeItem(k));
      AppLogger.info('STORAGE', 'Session cleared');
    }
  };


  /* ==============================================================
     APP LOGGER
     Provides level-based, category-tagged, colour-coded logging.
     All logs are accumulated (max 100) for the Debug Overlay export.
  ============================================================== */

  /**
   * Centralized logger — every module in the app calls this instead of console.*
   */
  const AppLogger = {
    logs: [],
    MAX_LOGS: 100,
    /** Verbose output on localhost; ERROR always visible */
    DEBUG_MODE: ['localhost', '127.0.0.1'].includes(window.location.hostname),

    /**
     * Core log method.
     * @param {string} level    - INFO | DEBUG | WARN | ERROR
     * @param {string} category - UI | SDK | AUTH | STORAGE | SYSTEM
     * @param {string} message  - Human-readable description.
     * @param {*}      data     - Optional payload (object/string).
     */
    log(level, category, message, data = null) {
      const timestamp = new Date().toISOString();
      const entry = { timestamp, level, category, message, data };
      this.logs.push(entry);
      if (this.logs.length > this.MAX_LOGS) this.logs.shift();

      if (this.DEBUG_MODE || level === 'ERROR') {
        console.log(
          `%c[${timestamp}] [${category}] [${level}]: ${message}`,
          `color:${this._colour(level)};font-weight:bold;`,
          data ?? ''
        );
      }

      /* Forward critical errors to Braze as Custom Events */
      if (level === 'ERROR' && window.braze) {
        try { window.braze.logCustomEvent('App_Error', { message, category, timestamp }); } catch (_) {}
      }
    },

    _colour(level) {
      return { ERROR: '#ff4d4d', WARN: '#ffa500', DEBUG: '#7f8c8d' }[level] ?? '#2ecc71';
    },

    /**
     * Returns the latest N log entries for display or export.
     * @param {number} n - Max entries to return.
     * @returns {Array}

    getLogs(n = 50) { return this.logs.slice(-n); },

    warn (cat, msg, data) { this.log('WARN',  cat, msg, data); },
    error(cat, msg, data) { this.log('ERROR', cat, msg, data); }

  /* ==============================================================
     BRAZE MANAGER
     All SDK calls are safely wrapped — the app NEVER crashes if
     the SDK is blocked by a browser extension or missing config.
  ============================================================== */

  /**
   * Handles all Braze WebSDK interactions.
   * Uses Observer pattern: components fire events via logEvent(),
   * not by touching window.braze directly.
   */
  const BrazeManager = {
    initialized: false,

    /**
     * Initializes the Braze SDK with the config from config.js.
     * Wrapped in try/catch because ad-blockers can break SDK imports.
     * @param {string} apiKey   - Braze API key.
     * @param {string} endpoint - Braze SDK endpoint URL.
     * @returns {boolean} True on success.
     */
    init(apiKey, endpoint) {
      if (!window.braze) {
        AppLogger.warn('SDK', 'Braze SDK unavailable — demo mode active');
        return false;
      }
      try {
        window.braze.initialize(apiKey, {
          baseUrl: endpoint,
          enableLogging: AppLogger.DEBUG_MODE,
          allowUserSuppliedJavascript: true,
          minimumIntervalBetweenTriggerActionsInSeconds: 3,
          inAppMessageZIndex: 9000
        });
        this._subscribeIAM();
        this._subscribeContentCards();
        window.braze.openSession();
        StorageManager.set('braze_init_status', { initialized: true, ts: Date.now() });
        this.initialized = true;
        AppLogger.info('SDK', 'Braze initialized', { apiKey: apiKey.slice(0, 8) + '…', endpoint });
        return true;
      } catch (e) {
        AppLogger.error('SDK', 'Braze init failed', e);
        return false;
      }
    },

    /**
     * Associates the browser session with the test user profile.
     * We use a predefined external_id so stakeholders always see the same profile.
     * @param {Object} user - User object from DemoData.
     */
    loginUser(user) {
      if (!window.braze) return;
      try {
        window.braze.changeUser(user.external_id);
        const bu = window.braze.getUser();
        if (bu) {
          bu.setFirstName(user.first_name);
          bu.setEmail(user.email);
          bu.setPhoneNumber(user.phone);
          bu.setCustomUserAttribute('loyalty_tier',   user.loyalty_tier);
          bu.setCustomUserAttribute('loyalty_points', user.loyalty_points);
          bu.setCustomUserAttribute('member_since',   user.member_since);
          bu.setCustomUserAttribute('platform',       'web_mobile_frame');
          bu.setCustomUserAttribute('app_version',    '1.0.0');
        }
        AppLogger.info('AUTH', 'Braze user set', { external_id: user.external_id });
      } catch (e) {
        AppLogger.error('SDK', 'changeUser failed', e);
      }
    },

    /**
     * Fires a Braze Custom Event with standardised enrichment properties.
     * Naming convention: "Category - Action" (Title Case).
     * @param {string} name  - Event name.
     * @param {Object} props - Additional event properties.
     */
    logEvent(name, props = {}) {
      const payload = {
        ...props,
        app_version: '1.0.0',
        platform:    'web_mobile_frame',
        timestamp:   new Date().toISOString()
      };
      AppLogger.debug('SDK', `Event → ${name}`, payload);
      if (!window.braze) return;
      try { window.braze.logCustomEvent(name, payload); } catch (e) {
        AppLogger.warn('SDK', `Event failed: ${name}`, e);
      }
    },

    /**
     * Intercepts IAMs and forces them to render inside #phone-frame.
     * Returning false lets us control the display manually via showInAppMessage().
     * @private
     */
    _subscribeIAM() {
      if (!window.braze) return;
      window.braze.subscribeToInAppMessage(iam => {
        AppLogger.info('SDK', 'IAM received', { type: iam.type });
        window.braze.showInAppMessage(iam);
        return false;
      });
    },

    /**
     * Subscribes to Content Card updates (push-based, not polled).
     * Banner cards (extras.type === 'banner') are mapped to the carousel.
     * @private
     */
    _subscribeContentCards() {
      if (!window.braze) return;
      window.braze.subscribeToContentCardsUpdates(cards => {
        const banners = cards.cards.filter(c => c.extras && c.extras['type'] === 'banner');
        AppLogger.info('SDK', 'Content Cards updated', { total: cards.cards.length, banners: banners.length });
      });
    }
  };

  /**
   * Renders filtered/grouped product shelves in the catalog.
   * @param {string} searchQuery - Live search text (may be empty).
   */
  function renderCatalogProducts(searchQuery = '') {
    const cat = AppState.currentCatalogCat;
    let pool  = DemoData.products.slice();

    if (cat !== 'all') pool = pool.filter(p => p.category === cat);
    if (searchQuery)   pool = pool.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));

    if (pool.length === 0) {
      document.getElementById('catalog-products').innerHTML = `
        <div style="text-align:center;padding:48px 20px;">
          <div style="font-size:3rem;margin-bottom:12px;">🔍</div>
          <p style="font-size:14px;color:var(--color-muted);">No products found</p>
        </div>`;
      return;
    }

    /* Show grouped shelves on "All" with no search; grid otherwise */
    if (cat === 'all' && !searchQuery) {
      const grouped = {};
      DemoData.categories.slice(1).forEach(c => {
        const items = pool.filter(p => p.category === c.id);
        if (items.length) grouped[c.label] = { items, id: c.id };
      });
      document.getElementById('catalog-products').innerHTML = Object.entries(grouped).map(
        ([label, { items, id }]) => `
          <div class="section-header">
            <span class="section-title">${label}</span>
            <span class="see-all" onclick="selectCategory('${id}')">See all</span>
          </div>
          <div class="product-shelf">${items.map(p => _tplProductCard(p)).join('')}</div>`
      ).join('');
    } else {
      document.getElementById('catalog-products').innerHTML = `
        <div class="section-header">
          <span class="section-title">${pool.length} item${pool.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="product-grid">${pool.map(p => _tplProductCardGrid(p)).join('')}</div>`;
    }
  }

  /** Handles Change Account form submission. */

    e.preventDefault();
    const newExternalId = document.getElementById('external_id_input').value.trim();
    if (!newExternalId) {
      showToast('Please enter a valid external_id');
      return;
    }
    
    // Update the user's external_id in DemoData

  /* ==============================================================
     CAROUSEL LOGIC
  ============================================================== */

  /**
   * Advances carousel to a specific slide.
   * @param {number} index - Target slide (wraps around).
   */
  function goToSlide(index) {
    const total = DemoData.banners.length;
    AppState.carouselIndex = ((index % total) + total) % total;
    const track = document.getElementById('carousel-track');
    if (track) track.style.transform = `translateX(-${AppState.carouselIndex * 100}%)`;
    document.querySelectorAll('.carousel-dot').forEach((d, i) =>
      d.classList.toggle('active', i === AppState.carouselIndex));
  }

  /** Starts (or restarts) the 4-second auto-rotation timer. */
  function startCarouselTimer() {
    if (AppState.carouselTimer) clearInterval(AppState.carouselTimer);
    AppState.carouselTimer = setInterval(() => goToSlide(AppState.carouselIndex + 1), 4000);
  }


  /* ==============================================================
     INTERACTIONS / ACTIONS
  ============================================================== */

  /**
   * Switches the active screen and fires a Braze Navigation event.
   * @param {string} screenId - Target screen ID.
   */
  function navigateTo(screenId) {
    if (AppState.currentScreen === screenId) return;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(`screen-${screenId}`)?.classList.add('active');
    AppState.currentScreen = screenId;

    /* Reset scroll position on every navigation */
    const content = document.getElementById('app-content');
    if (content) content.scrollTop = 0;

    /* Re-render screens that hold dynamic state */
    if (screenId === 'cart') renderCart();
    if (screenId === 'promotions') {
      BrazeManager.logEvent('Promotion - Viewed');
      /* Clear notification badge when user visits Offers */
      AppState.newOffersCount = 0;
    }

    BrazeManager.logEvent('Navigation - Tab Switched', { screen: screenId });
    renderBottomNav();
    AppLogger.info('UI', `Screen: ${screenId}`);
  }

  /**
   * Stores the selected order type and updates the UI.
   * @param {string} id    - Order type id.
   * @param {string} label - Display name.
   */
  function selectOrderType(id, label) {
    AppState.selectedOrderType = id;
    StorageManager.set('selected_order_type', id);
    BrazeManager.logEvent('Order Type - Selected', { type: id, label });
    renderOrderTypes();
    showToast(`${label} selected ✓`);
    AppLogger.info('UI', `Order type: ${label}`);
  }

  /**
   * Switches the catalog category filter.
   * @param {string} catId - Category ID.
   */
  function selectCategory(catId) {
    AppState.currentCatalogCat = catId;
    renderCategoryPills();
    renderCatalogProducts();
    BrazeManager.logEvent('Catalog - Category Selected', { category: catId });
    document.getElementById('app-content').scrollTop = 0;
  }

  /**
   * Live-filters catalog products by the typed search query.
   * @param {string} q - Search text.
   */
  function filterCatalog(q) { renderCatalogProducts(q); }

  /**
   * Switches the active Promotions tab.
   * @param {string} tab - Tab label.
   */
  function selectPromoTab(tab) {
    AppState.currentPromoTab = tab;
    renderPromoTabs();
    renderPromosList();
    BrazeManager.logEvent('Promotion - Tab Switched', { tab });
  }

  /**
   * Logs a promotion detail view event and shows a toast.
   * @param {string} promoId - Promotion identifier.
   */
  function viewPromoDetail(promoId) {
    const p = DemoData.promotions.find(x => x.id === promoId);
    if (!p) return;
    BrazeManager.logEvent('Promotion - Details Viewed', { promo_id: promoId, title: p.title, tab: p.tab });
    showToast(p.title);
  }

  /**
   * Adds one unit of a product to the cart.
   * @param {string} productId - Product identifier.
   */
  function addToCart(productId) {
    const p = DemoData.products.find(x => x.id === productId);
    if (!p) return;
    const existing = AppState.cart.find(i => i.id === productId);
    if (existing) { existing.qty++; } else { AppState.cart.push({ id: productId, qty: 1, price: p.price }); }
    StorageManager.set('cart', AppState.cart);
    BrazeManager.logEvent('Cart - Item Added', { product_id: productId, name: p.name, price: p.price, category: p.category });
    showToast(`${p.emoji} ${p.name} added`);
    renderBottomNav();
    AppLogger.info('UI', `Added to cart: ${p.name}`);
  }

  /**
   * Adjusts cart quantity for an item; removes it if quantity reaches zero.
   * @param {string} productId - Product identifier.
   * @param {number} delta     - +1 or -1.
   */
  function updateCartQty(productId, delta) {
    const item = AppState.cart.find(i => i.id === productId);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) {
      AppState.cart = AppState.cart.filter(i => i.id !== productId);
      BrazeManager.logEvent('Cart - Item Removed', { product_id: productId });
    }
    StorageManager.set('cart', AppState.cart);
    renderCart();
    renderBottomNav();
  }

  /** Empties the entire cart and refreshes the cart screen. */
  function clearCart() {
    AppState.cart = [];
    StorageManager.set('cart', []);
    BrazeManager.logEvent('Cart - Cleared');
    renderCart();
    renderBottomNav();
    AppLogger.info('UI', 'Cart cleared');
  }

  /** Fires Braze checkout event, shows confirmation sheet, and clears cart. */
  function checkout() {
    const itemCount = AppState.getCartCount();
    const total     = AppState.getCartTotal();
    const delivery  = AppState.selectedOrderType === 'delivery' ? 3.99 : 0;

    BrazeManager.logEvent('Cart - Checkout Started', {
      item_count:  itemCount,
      subtotal:    total,
      total:       total + delivery,
      order_type:  AppState.selectedOrderType ?? 'not_selected'
    });

    showOrderConfirmation({
      items:     itemCount,
      subtotal:  total,
      total:     total + delivery,
      orderType: AppState.selectedOrderType
    });

    clearCart();
    AppLogger.info('UI', 'Checkout completed', { items: itemCount, total: total + delivery });
  }

  /**
   * Shows a transient toast notification inside the phone frame.
   * @param {string} msg       - Message to display.
   * @param {number} duration  - Visibility duration in ms.
   */
  function showToast(msg, duration = 2200) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  /** Toggles the SDK Debug overlay and re-renders its content when opening. */
  function toggleDebug() {
    const el     = document.getElementById('debug-overlay');
    const isOpen = el.classList.contains('open');
    if (!isOpen) renderDebugPanel();
    el.classList.toggle('open');
    AppLogger.debug('UI', `Debug overlay ${isOpen ? 'closed' : 'opened'}`);
  }

  /**
   * Closes the debug overlay when the user clicks on the darkened backdrop.
   * @param {MouseEvent} e
   */
  function handleOverlayBgClick(e) {
    if (e.target === document.getElementById('debug-overlay')) toggleDebug();
  }

  /**
   * Resets the application to its initial demo state:
   * clears LocalStorage, cart, order selection, and returns to the Home screen.
   */
  function resetApp() {
    StorageManager.clearSession();
    AppState.cart              = [];
    AppState.selectedOrderType = null;
    AppState.currentScreen     = 'home';
    AppState.currentCatalogCat = 'all';
    AppState.currentPromoTab   = 'Discounts';
    AppState.carouselIndex     = 0;
    AppState.newOffersCount    = 2;

    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-home')?.classList.add('active');

    closeProductDetail();
    closeOrderConfirm();
    dismissIAM();

    /* Hide login screen if open */
    const loginEl = document.getElementById('login-screen');
    if (loginEl) { loginEl.style.display = 'none'; loginEl.style.opacity = ''; loginEl.classList.remove('visible'); }

    renderAllScreens();
    renderBottomNav();
    BrazeManager.logEvent('App - Reset');
    showToast('Demo reset to initial state');
    AppLogger.info('SYSTEM', 'App reset to initial demo state');
  }


  /* ==============================================================
     STATUS BAR — live clock
  ============================================================== */

  /**
   * Updates the status bar time display to current local time.
   * Called on init and every 30 seconds.
   */
  function updateStatusClock() {
    const el = document.getElementById('status-time');
    if (!el) return;
    const now = new Date();
    el.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  }


  /* ==============================================================
     SPLASH SCREEN
  ============================================================== */

  /**
   * Hides the splash screen with a fade animation, then calls cb.
   * @param {Function} cb - Callback to run after splash is gone.
   */
  function hideSplash(cb) {
    const el = document.getElementById('splash-screen');
    if (!el) { cb(); return; }
    el.classList.add('hiding');
    setTimeout(() => {
      el.style.display = 'none';
      if (cb) cb();
    }, 520);
  }

  /* ==============================================================
     CAROUSEL SWIPE (touch events)
  ============================================================== */

  /**
   * Attaches touchstart / touchend handlers to the carousel for swipe navigation.
   * Called after carousel HTML is rendered.
   */
  function attachCarouselSwipe() {
    const clip = document.querySelector('.carousel-clip');
    if (!clip) return;
    let startX = 0;
    clip.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
    clip.addEventListener('touchend', e => {
      const diff = startX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 45) {
        goToSlide(AppState.carouselIndex + (diff > 0 ? 1 : -1));
        startCarouselTimer(); /* restart timer after manual swipe */
      }
    }, { passive: true });
    /* Pause auto-rotate while finger is on carousel */
    clip.addEventListener('touchstart', () => clearInterval(AppState.carouselTimer), { passive: true });
  }

  /* ==============================================================
     INITIALIZATION
  ============================================================== */

  /**
   * Application bootstrap — called on DOMContentLoaded.
   * Flow: Splash (1.5s) → Login Screen → Sign In → Main App
   */
  function initApp() {
    AppLogger.info('SYSTEM', 'Safia Gourmet Bakery — starting', { version: '1.0.0', platform: 'web_mobile_frame' });

    /* Start live status bar clock */
    updateStatusClock();
    setInterval(updateStatusClock, 30000);

    /* Restore persisted state */
    AppState.cart              = StorageManager.get('cart', []);
    AppState.selectedOrderType = StorageManager.get('selected_order_type', null);

    /* Init Braze — gracefully skipped if CDN blocked or config missing */
    if (window.BrazeConfig && BrazeConfig.apiKey !== 'YOUR_BRAZE_API_KEY_HERE') {
      BrazeManager.init(BrazeConfig.apiKey, BrazeConfig.endpoint);
    } else {
      AppLogger.warn('SDK', 'Braze placeholder config — running in demo mode (no real events sent)');
    }

    /* Pre-render all screen content while splash is shown */
    renderAllScreens();
    renderBottomNav();

    const alreadyLoggedIn = StorageManager.get('logged_in', false);

    /* Splash → Login → (or straight to app if already logged in) */
    setTimeout(() => {
      hideSplash(() => {
        if (alreadyLoggedIn) {
          BrazeManager.loginUser(DemoData.user);
          AppLogger.info('SYSTEM', 'App ready (returning user)', { user: DemoData.user.external_id });
        } else {
          showLoginScreen();
        }
      });
    }, 1800);
  }

  document.addEventListener('DOMContentLoaded', initApp);
  </script>
